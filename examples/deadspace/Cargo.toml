[package]
name = "deadspace"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "deadspace"
path = "main.rs"

[dependencies]
bevy = { workspace = true, features = ["default"] }
# Every bevy-react feature (the defaults): `<surface>` for every hologram,
# `<portal>` for the item preview and the map, `<svg>` and `<canvas>` inside
# them.
bevy-react = { workspace = true, features = ["default"] }
# For the nested payload types the macros don't derive themselves.
serde = { workspace = true }
ts-rs = { workspace = true }
