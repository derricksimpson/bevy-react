[package]
name = "nodes"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "nodes"
path = "main.rs"

[dependencies]
bevy = { workspace = true, features = ["default"] }
# Every bevy-react feature (the defaults): `<portal>` for the 3D preview,
# `<svg>` for the icons.
bevy-react = { workspace = true, features = ["default"] }
# For the nested payload types (`NodeDef`, `GraphNode`, …) the macros don't
# derive themselves.
serde = { workspace = true }
ts-rs = { workspace = true }
