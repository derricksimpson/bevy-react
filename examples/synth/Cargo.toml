[package]
name = "synth"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "synth"
path = "main.rs"

[dependencies]
bevy = { workspace = true, features = ["default"] }
# `<svg>` for the node previews and knobs; devtools for F12.
bevy-react = { workspace = true, features = ["svg", "devtools"] }
# For the nested payload types (`Wire`, `Drag`) the macros don't derive
# themselves.
serde = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
